<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar — Devangky Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body><header class="header"><div class="container header-inner">
      <a class="logo" href="index.html">⚡ <span data-store-name>Devangky Store</span></a>
      <nav class="site-nav"><a href="produk.html">Produk</a><a href="docs.html">Cara Order</a><a href="pembayaran.html">Pembayaran</a><a href="testimoni.html">Testimoni</a></nav>
      <div id="authContainer"></div><div id="mobileAuth"></div>
    </div></header>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-icon">⚡</div>
        <h2>Daftar Akun</h2>
        <p>Buat akun gratis untuk mulai belanja</p>
      </div>

      <div class="form-error" id="registerError"></div>
      <div class="form-success" id="registerSuccess"></div>

      <form onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="regNama">Nama Lengkap</label>
          <input type="text" id="regNama" name="nama" placeholder="Nama lengkapmu" required autocomplete="name">
        </div>
        <div class="form-group">
          <label for="regEmail">Email</label>
          <input type="email" id="regEmail" name="email" placeholder="email@contoh.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="regPassword">Password</label>
          <input type="password" id="regPassword" name="password" placeholder="Minimal 6 karakter" required minlength="6" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="regConfirm">Konfirmasi Password</label>
          <input type="password" id="regConfirm" name="confirm" placeholder="Ulangi password" required minlength="6" autocomplete="new-password">
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">Daftar Akun</button>
      </form>

      <div class="auth-divider">atau</div>

      <button type="button" class="btn btn-google btn-block" onclick="handleGoogleLogin()">
        <svg width="18" height="18" viewBox="0 0 24 24" style="margin-right:6px">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Daftar dengan Google
      </button>

      <div class="auth-footer">
        Sudah punya akun? <a href="login.html">Login di sini</a>
      </div>
      <div style="text-align:center;margin-top:16px">
        <a href="index.html" style="font-size:0.85rem;color:var(--text-muted)">← Kembali ke Beranda</a>
      </div>
    </div>
  </div>

  <script type="module" src="assets/js/auth.js"></script>
</body>
</html>
